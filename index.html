<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="icon" type="image/png" href="socialpulse-logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SocialPulse AI – Social Media Analytics</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* SocialPulse AI — Startup Loader */
#sp-loader{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:22px;
  background:radial-gradient(circle at center,#08384a 0%,#04131f 42%,#020912 100%);
  opacity:1;
  visibility:visible;
  transition:opacity .8s ease, visibility .8s ease;
}
#sp-loader.sp-loader-hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
.sp-loader-logo{
  width:115px;
  height:115px;
  object-fit:contain;
  border-radius:24px;
  filter:drop-shadow(0 0 24px rgba(0,220,255,.45));
  animation:sp-logo-pulse 1.8s ease-in-out infinite;
}
.sp-loader-title{
  margin:0;
  color:#e6f7fb;
  font-size:clamp(1.35rem,4vw,2rem);
  font-weight:700;
  letter-spacing:.04em;
}
.sp-loader-subtitle{
  margin:-12px 0 0;
  color:#8fb3c4;
  font-size:.85rem;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.sp-loader-bar{
  width:min(220px,55vw);
  height:3px;
  overflow:hidden;
  border-radius:99px;
  background:rgba(255,255,255,.12);
}
.sp-loader-bar::after{
  content:"";
  display:block;
  width:45%;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,transparent,#25d9ff,#fff,transparent);
  animation:sp-loader-slide 1.15s ease-in-out infinite;
}
@keyframes sp-logo-pulse{
  0%,100%{transform:scale(1);filter:drop-shadow(0 0 18px rgba(0,220,255,.35))}
  50%{transform:scale(1.06);filter:drop-shadow(0 0 34px rgba(0,220,255,.7))}
}
@keyframes sp-loader-slide{
  from{transform:translateX(-150%)}
  to{transform:translateX(330%)}
}
</style>
<style>
:root{--bg:#020912;--mut:#8fb3c4;--txt:#e6f7fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(80px + env(safe-area-inset-top,0px))}
body{position:relative;isolation:isolate;background:linear-gradient(145deg,#061322 0%,#020912 48%,#071526 100%);background-size:180% 180%;animation:base-shift 32s ease-in-out infinite alternate;color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(ellipse at 78% 8%,#087e9d45,transparent 34%),radial-gradient(ellipse at 8% 35%,#2544a333,transparent 38%),radial-gradient(ellipse at 82% 82%,#0c766739,transparent 34%),radial-gradient(circle,#8ceaff65 1px,transparent 1.6px),radial-gradient(circle,#8ceaff40 1px,transparent 1.7px),linear-gradient(#72d5ff08 1px,transparent 1px),linear-gradient(90deg,#72d5ff08 1px,transparent 1px);background-size:130% 130%,140% 140%,135% 135%,113px 113px,173px 173px,48px 48px,48px 48px;background-position:0 0,100% 20%,40% 100%,20px 35px,75px 12px,0 0,0 0;animation:backdrop-drift 48s ease-in-out infinite alternate;mask-image:linear-gradient(to bottom,#000 0%,#000 100%)}
body::after{content:"";position:fixed;inset:-45%;z-index:-2;pointer-events:none;background:conic-gradient(from 20deg at 50% 50%,transparent 0deg,#0ea5e91c 55deg,transparent 115deg,#8b5cf61c 185deg,transparent 245deg,#14b8a61c 310deg,transparent 360deg);filter:blur(90px);opacity:.75;animation:aurora-turn 70s linear infinite;mask-image:radial-gradient(ellipse at center,#000 0%,transparent 68%)}
.ambient{position:fixed;z-index:-1;pointer-events:none;width:25rem;height:25rem;border-radius:50%;filter:blur(90px);opacity:.16;animation:ambient-drift 18s ease-in-out infinite alternate}
.ambient.a{top:8%;right:-10rem;background:#06b6d4}.ambient.b{bottom:4%;left:-12rem;background:#6366f1;animation-delay:-7s}.ambient.c{top:45%;left:38%;width:19rem;height:19rem;background:#14b8a6;opacity:.09;animation-delay:-11s}
#network-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;opacity:.42}
#network-bg canvas{display:block}
.grad{background:linear-gradient(90deg,#38bdf8,#22d3ee,#2dd4bf);-webkit-background-clip:text;background-clip:text;color:transparent}
.pn{background:linear-gradient(145deg,#0c2036e8,#071424ed);border:1px solid #20516a99;border-radius:16px;padding:16px;box-shadow:0 12px 34px -24px #22d3ee, inset 0 1px #b9f5ff0a;backdrop-filter:blur(14px);transition:transform .3s,border-color .3s,box-shadow .3s}
.pn:hover{transform:translateY(-2px);border-color:#22d3ee88;box-shadow:0 16px 38px -24px #22d3ee66,inset 0 1px #b9f5ff12}
.pt{font-size:13px;font-weight:600;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(100deg,#0891b2,#22d3ee 60%,#2dd4bf);color:#03131f;font-weight:700;border-radius:10px;padding:9px 16px;transition:.3s;box-shadow:0 8px 24px -10px #22d3ee}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.sel{background:#08192be8;border:1px solid #20516a;border-radius:10px;padding:7px 11px;font-size:12px;color:var(--txt);backdrop-filter:blur(10px)}
.icon{display:inline-block;flex:none;vertical-align:middle}
.icon-button{width:38px;height:38px;display:grid;place-items:center;border:1px solid #20516a;border-radius:12px;background:#0a1b2dcc;color:#a5f3fc;transition:.25s}
.icon-button:hover{color:#fff;border-color:#22d3ee;background:#0e3548;transform:translateY(-2px)}
.metric-icon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,#ffffff12,#ffffff04);box-shadow:inset 0 1px #ffffff18,0 8px 20px -12px currentColor}
.float-icon{animation:icon-float 4s ease-in-out infinite}
.metric-icon svg{filter:drop-shadow(0 0 7px currentColor)}
.brand-mark{width:42px;height:42px;margin:0 auto 6px;display:grid;place-items:center;border:1px solid #ffffff24;border-radius:14px;color:#fff;box-shadow:0 8px 20px -12px currentColor,inset 0 1px #ffffff30}
.brand-mark svg{width:29px;height:29px;display:block}
.upload-symbol{width:66px;height:66px;margin:auto;display:grid;place-items:center;border:1px solid #22d3ee66;border-radius:22px;background:radial-gradient(circle at 35% 25%,#22d3ee35,#0b2034);box-shadow:0 12px 32px -16px #22d3ee; color:#67e8f9}
.drop{background:linear-gradient(145deg,#0a213633,#07152466)}
.sec{opacity:0;transform:translateY(40px);transition:opacity .9s,transform .9s cubic-bezier(.2,.7,.2,1)}.sec.in{opacity:1;transform:none}
.step{width:46px;height:46px;border-radius:50%;border:2px solid #22d3ee;display:grid;place-items:center;font-weight:700;color:#67e8f9;box-shadow:0 0 18px #22d3ee88;animation:ping2 2.2s infinite}
.globe{width:130px;height:130px;border-radius:50%;position:relative;background:radial-gradient(circle at 35% 30%,#22d3ee55,#0a3a52 45%,#041524 75%);border:1px solid #22d3ee66;box-shadow:0 0 40px -8px #22d3ee;animation:float 5s ease-in-out infinite}
.globe .platform-mark{position:absolute;width:34px;height:34px;border:1px solid #ffffff3b;border-radius:11px;display:grid;place-items:center;color:#fff;box-shadow:0 5px 16px #02091288}
.platform-mark svg{width:21px;height:21px;display:block}
.platform-float{animation:platform-float 3.6s ease-in-out infinite}
.influence-brand{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;box-shadow:0 7px 20px -8px currentColor}
.influence-brand svg{width:26px;height:26px}
.ln{stroke-dasharray:1;stroke-dashoffset:1}.in .ln{animation:dr 2s ease-out forwards}
.dn{opacity:0;transition:opacity 1s .3s}.in .dn{opacity:1}
.hb{transform-origin:left;transform:scaleX(0);transition:transform 1.3s cubic-bezier(.2,.7,.2,1)}.in .hb{transform:none}
.vb{transform-origin:bottom;transform:scaleY(0);transition:transform 1.3s cubic-bezier(.2,.7,.2,1)}.in .vb{transform:none}
.dot{display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:11px;color:#6f93a5;transition:.3s}
.dot b{width:7px;height:7px;border-radius:50%;background:#155e75;transition:.3s}
.dot.on,.dot:hover{color:#67e8f9}.dot.on b{background:#22d3ee;box-shadow:0 0 10px #22d3ee;transform:scale(1.5)}
.ok{color:#2dd4bf}.bad{color:#f87171}
.pu{animation:pu 2.4s ease-in-out infinite}
.drop.on{background:#22d3ee14;border-color:#22d3ee}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes float{50%{transform:translateY(-10px)}}
@keyframes icon-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes platform-float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.06)}}
@keyframes ambient-drift{to{transform:translate3d(3rem,-2rem,0) scale(1.12)}}
@keyframes base-shift{0%{background-position:0% 20%}100%{background-position:100% 80%}}
@keyframes backdrop-drift{0%{background-position:0 0,100% 20%,40% 100%,20px 35px,75px 12px,0 0,0 0}100%{background-position:8% 12%,84% 4%,55% 84%,55px 75px,130px 68px,24px 30px,24px 30px}}
@keyframes aurora-turn{to{transform:rotate(360deg)}}
@keyframes pu{50%{opacity:.5;transform:scale(1.25)}}
@keyframes ping2{0%{box-shadow:0 0 0 0 #22d3ee88}100%{box-shadow:0 0 0 16px #22d3ee00}}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,80px);background:#06253a;border:1px solid #22d3ee;padding:10px 18px;border-radius:999px;font-size:13px;transition:.4s;z-index:60;box-shadow:0 0 30px -6px #22d3ee}#toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.sec{opacity:1;transform:none}}
</style></head>
<body>
<!-- SocialPulse AI Startup Loader -->
<div id="sp-loader" aria-label="Loading SocialPulse AI">
  <img class="sp-loader-logo" src="socialpulse-logo.png" alt="SocialPulse AI">
  <h1 class="sp-loader-title">SocialPulse AI</h1>
  <p class="sp-loader-subtitle">Social Media Analytics</p>
  <div class="sp-loader-bar" aria-hidden="true"></div>
</div>

<div id="network-bg" aria-hidden="true"></div>
<div class="ambient a"></div><div class="ambient b"></div><div class="ambient c"></div>
<header class="sticky top-0 z-40 h-[88px] md:h-[112px] flex items-center gap-3 px-4 md:px-10 border-b border-cyan-900/50 bg-[#030c18]/90 backdrop-blur" style="top:env(safe-area-inset-top,0px)">
 <a href="#upload" aria-label="SocialPulse home" class="flex items-center justify-center w-[112px] h-[78px] md:w-[144px] md:h-[102px] shrink-0 transition hover:scale-[1.02] focus-visible:outline focus-visible:outline-2 focus-visible:outline-cyan-300"><img src="socialpulse-logo.png" alt="SocialPulse — AI-Driven Social Media Analytics Framework" class="w-full h-full object-contain"></a>
 <label class="relative hidden sm:block w-64 ml-4"><svg class="icon absolute left-3 top-1/2 -translate-y-1/2 text-cyan-300" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg><input class="sel w-full pl-9" placeholder="Search social media data..."></label>
 <div class="flex-1"></div>
 <div class="sel hidden md:flex items-center gap-2"><svg class="icon text-cyan-300" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span>Sep 1, 2026 - Sep 30, 2026</span></div>
 <button aria-label="Notifications" onclick="toast('No new notifications')" class="icon-button"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button>

<main id="app" class="max-w-[1500px] mx-auto px-4 md:px-10 md:pr-28 pb-16"></main>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const I=(name,size=20)=>{const p={search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>',upload:'<path d="M12 16V4m-5 5 5-5 5 5"/><path d="M20 16.5v2A2.5 2.5 0 0 1 17.5 21h-11A2.5 2.5 0 0 1 4 18.5v-2"/>',chart:'<path d="M3 3v18h18"/><path d="m7 14 4-4 4 4 6-7"/>',posts:'<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>',message:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/>',flame:'<path d="M8.5 14.5A4.5 4.5 0 0 0 13 19a5 5 0 0 0 5-5c0-4-3-5.5-3-9-2 1-3 3-3 5-2-1-3-3-3-5-3 2-5 5.5-5 9a8 8 0 0 0 8 8"/>',user:'<circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>',sparkles:'<path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3Z"/><path d="m19 14 1.2 2.8L23 18l-2.8 1.2L19 22l-1.2-2.8L15 18l2.8-1.2L19 14ZM5 2l.8 2.2L8 5l-2.2.8L5 8l-.8-2.2L2 5l2.2-.8L5 2Z"/>',cloud:'<path d="M20 16.2A4.5 4.5 0 0 0 18 7.5h-1.2A7 7 0 0 0 3.3 10 4 4 0 0 0 4 18h4"/><path d="m12 12-4 4m4-4 4 4m-4-4v9"/>'};return `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p[name]}</svg>`};
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove('show'),2200)};
const R=(s=>()=>(s=s*16807%2147483647)/2147483647)(11);
const xl=['Sep 1','Sep 5','Sep 10','Sep 15','Sep 20','Sep 25','Sep 30'];
const ser=(b,a,t)=>Array.from({length:30},(_,i)=>b+t*i+(R()-.5)*a);
const K=v=>v>=1000?Math.round(v/1000)+'K':Math.round(v)+'',P=v=>Math.round(v)+'%';
function line(ss,{area,fmt=K,max}={}){const W=600,H=200,L=40,B=24,T=8,mx=max||Math.max(...ss.flatMap(s=>s.d))*1.1,X=i=>L+i*(W-L-8)/29,Y=v=>T+(H-T-B)*(1-v/mx);let g='';
for(let k=0;k<=4;k++){const y=T+(H-T-B)*k/4;g+=`<line x1="${L}" x2="${W-8}" y1="${y}" y2="${y}" stroke="#164e63" stroke-opacity=".6"/><text x="${L-6}" y="${y+3}" text-anchor="end" fill="#7fa3b5" font-size="10">${fmt(mx*(1-k/4))}</text>`}
xl.forEach((t,k)=>g+=`<text x="${X(k*29/6)}" y="${H-6}" text-anchor="middle" fill="#7fa3b5" font-size="10">${t}</text>`);
ss.forEach(s=>{const p=s.d.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('');
if(area)g+=`<path d="${p}L${X(29)} ${H-B}L${L} ${H-B}Z" fill="#22d3ee" fill-opacity=".15"/>`;
g+=`<path class="ln" pathLength="1" d="${p}" fill="none" stroke="${s.c}" stroke-width="2"/>`});
return `<svg viewBox="0 0 ${W} ${H}" class="w-full">${g}</svg>`}
const lg=(d,p='%')=>`<div class="space-y-1.5 text-xs flex-1 min-w-[110px]">${d.map(x=>`<div class="flex items-center gap-2"><i class="w-2.5 h-2.5 rounded-sm" style="background:${x.c}"></i><span class="flex-1">${x.n}</span><span>${x.v}${p}</span></div>`).join('')}</div>`;
const key=d=>`<div class="flex flex-wrap gap-3 text-[11px] mb-1">${d.map(x=>`<span class="flex items-center gap-1"><i class="w-2 h-2 rounded-sm" style="background:${x.c}"></i>${x.n}</span>`).join('')}</div>`;
function donut(d,c,sz=130){const T=d.reduce((a,b)=>a+b.v,0),r=40,C=2*Math.PI*r;let o=0;
const s=d.map(x=>{const l=x.v/T*C,e=`<circle class="dn" cx="60" cy="60" r="${r}" fill="none" stroke="${x.c}" stroke-width="14" stroke-dasharray="${l-1.5} ${C}" stroke-dashoffset="${-o}"/>`;o+=l;return e}).join('');
return `<div class="relative shrink-0" style="width:${sz}px;height:${sz}px"><svg viewBox="0 0 120 120" class="-rotate-90">${s}</svg><div class="absolute inset-0 grid place-items-center text-center leading-tight"><div><b class="text-base">${c}</b><div class="text-[10px] text-[var(--mut)]">Posts</div></div></div></div>`}
const dl=(d,c,sz)=>`<div class="flex items-center gap-3 flex-wrap">${donut(d,c,sz)}${lg(d)}</div>`;
const hb=(a,c='#22d3ee')=>{const m=Math.max(...a.map(x=>x[1]));return `<div class="space-y-1.5">${a.map((x,i)=>`<div class="flex items-center gap-2 text-xs"><span class="w-28 truncate">${x[0]}</span><div class="flex-1 h-2 rounded bg-cyan-950"><div class="hb h-2 rounded" style="width:${x[1]/m*100}%;background:${c};transition-delay:${i*70}ms"></div></div><span class="w-10 text-right text-[var(--mut)]">${x[2]||x[1]}</span></div>`).join('')}</div>`};
const tb=(h,r)=>`<table class="w-full text-xs"><thead class="text-[var(--mut)]"><tr>${h.map(x=>`<th class="text-left font-normal py-1">${x}</th>`).join('')}</tr></thead><tbody>${r.map(a=>`<tr class="border-t border-cyan-900/50 hover:bg-cyan-400/5">${a.map(x=>`<td class="py-1.5">${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const pn=(t,b,c='')=>`<div class="pn ${c}"><div class="pt">${t}</div>${b}</div>`;
const kp=(ic,l,to,suf,d,c,dec=0)=>`<div class="pn flex items-center gap-3"><div class="metric-icon float-icon" style="color:${c};border:1px solid ${c}66">${I(ic,22)}</div><div><div class="text-xs text-[var(--mut)]">${l}</div><div class="text-2xl font-bold"><span class="cnt" data-to="${to}" data-suf="${suf}" data-dec="${dec}">0</span></div><div class="text-[11px] ${d[0]=='↑'?'ok':'bad'}">${d}</div></div></div>`;
const hdr=(t,s,f=1)=>`<div class="flex flex-wrap items-end justify-between gap-3 mb-4"><div><h2 class="text-2xl font-bold">${t}</h2><p class="text-xs text-[var(--mut)]">${s}</p></div>${f?`<div class="flex flex-wrap gap-2 items-center"><select class="sel"><option>All Platforms</option><option>X</option><option>Instagram</option></select><select class="sel"><option>Last 30 Days</option><option>Last 7 Days</option></select><select class="sel"><option>All Topics</option></select><button class="btn text-xs" onclick="toast('AI insight generated')">${I('sparkles',15)}Generate AI Insight</button></div>`:''}</div>`;
const grid=(c,...a)=>`<div class="grid gap-4 ${c} mb-4">${a.join('')}</div>`;
const C1='#22d3ee',C2='#2dd4bf',C3='#38bdf8',C4='#a78bfa',C5='#fb923c',C6='#f472b6',NG='#f87171';
const plat=[{n:'X (Twitter)',v:38,c:C1},{n:'Instagram',v:24,c:C4},{n:'YouTube',v:18,c:NG},{n:'Facebook',v:12,c:C3},{n:'Reddit',v:6,c:C5},{n:'Others',v:2,c:'#94a3b8'}];
